name: Build Apple Seed VoLTE APK

on:
  push:
    paths:
      - "volteapp/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-volte-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Build APK
        run: gradle :volteapp:assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleSeed-VoLTE-APK
          path: volteapp/build/outputs/apk/release/volteapp-release.apk
          if-no-files-found: error
