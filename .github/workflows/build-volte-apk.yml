name: Build Apple Seed VoLTE APK

on:
  push:
    paths:
      - "volteapp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-volte-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build APK
        run: gradle :volteapp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleSeed-VoLTE-APK
          path: volteapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK for Apple Seed Tool
        run: |
          cp volteapp/build/outputs/apk/debug/*.apk apps/AppleSeed_VoLTE.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/AppleSeed_VoLTE.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore: publish Apple Seed VoLTE APK"
            git push
          fi
